<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Order & Garansi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brandPurple: '#5338FF', brandPurpleLight: '#EEECFF', brandLime: '#CCFF00', darkText: '#0F172A', softBg: '#F8FAFC', waGreen: '#25D366' }
                }
            }
        }
    </script>
    <style>
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-softBg text-darkText font-sans min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">
    <main class="bg-white rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] w-full max-w-md overflow-hidden border border-gray-100">
        <div class="bg-brandPurple p-8 text-center relative overflow-hidden">
            <div class="relative z-10 w-16 h-16 bg-brandLime rounded-2xl mx-auto flex items-center justify-center text-brandPurple shadow-lg mb-4 transform -rotate-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <h1 class="relative z-10 text-2xl font-extrabold text-white mb-1">Lacak Pesanan</h1>
            <p class="relative z-10 text-brandPurpleLight text-sm font-medium">Cek masa aktif dan status garansi layananmu</p>
        </div>

        <div class="p-6 sm:p-8">
            <form id="checkForm" class="space-y-4">
                <input type="text" id="orderId" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-xl focus:bg-white focus:outline-none focus:border-brandPurple focus:ring-4 focus:ring-brandPurpleLight transition-all font-bold text-center uppercase tracking-wider text-lg placeholder-gray-300" placeholder="MASUKKAN ID ORDER" required autocomplete="off">
                <button type="submit" id="submitBtn" class="w-full bg-darkText hover:bg-brandPurple text-white hover:text-brandLime font-bold py-4 px-4 rounded-xl transition-all duration-300 shadow-md flex items-center justify-center gap-2">
                    <span>Periksa Status</span>
                </button>
            </form>

            <div id="loadingState" class="hidden py-8 flex flex-col items-center justify-center">
                <div class="w-10 h-10 border-4 border-brandPurpleLight border-t-brandPurple rounded-full animate-spin mb-3"></div>
                <p class="text-sm text-gray-500 font-bold animate-pulse">Mencari data...</p>
            </div>

            <div id="resultState" class="hidden mt-6 animate-fade-in space-y-4">
                <div class="flex flex-col border border-gray-100 rounded-2xl bg-white shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">PRODUK</p>
                            <p id="resProduct" class="font-bold text-sm text-darkText">-</p>
                        </div>
                        <div id="resStatusBadge"></div>
                    </div>
                    <div class="grid grid-cols-2 divide-x divide-gray-100 p-4">
                        <div class="pr-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">TGL ORDER</p>
                            <p id="resOrderDate" class="text-xs font-semibold text-darkText">-</p>
                        </div>
                        <div class="pl-4">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">TGL EXPIRED</p>
                            <p id="resExpireDate" class="text-xs font-semibold text-darkText">-</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-brandPurpleLight p-3.5 rounded-2xl border border-brandPurple/10">
                        <p class="text-[10px] font-bold text-brandPurple uppercase tracking-wider mb-1">Sisa Durasi</p>
                        <p id="resDuration" class="font-extrabold text-xl text-darkText">-</p>
                    </div>
                    <div id="warrantyBox" class="bg-green-50 p-3.5 rounded-2xl border border-green-100">
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Garansi</p>
                        <p id="resWarranty" class="font-extrabold text-sm text-darkText mt-1 flex items-center gap-1">Tersedia</p>
                    </div>
                </div>
                <a href="#" id="ctaBtn" target="_blank" class="w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md">
                    <span id="ctaText">Klaim Garansi / Bantuan</span>
                </a>
            </div>
        </div>
    </main>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            }
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
        }

        // =========================================================================
        // INI DATABASENYA KAK JIHAN! KETIK MANUAL DI SINI AJA, DIJAMIN AMAN!
        // Kalau ada orderan baru, tinggal tambahin di bawahnya ya.
        // Format tanggal: YYYY-MM-DD (Tahun-Bulan-Tanggal)
        // =========================================================================
        const dataPesanan = [
            { id_order: "ORD-123", produk: "Netflix Premium", tgl_order: "2026-10-10", tgl_expired: "2026-11-10" },
            { id_order: "ORD-124", produk: "Spotify Premium", tgl_order: "2026-10-01", tgl_expired: "2026-11-01" },
            { id_order: "ORD-125", produk: "Canva Pro", tgl_order: "2026-10-05", tgl_expired: "2027-10-05" }
        ];

        const nomorWA = '6281234567890'; 
        
        document.getElementById('checkForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const orderId = document.getElementById('orderId').value.trim().toUpperCase();
            if(!orderId) return;

            playSound('pop');
            document.getElementById('resultState').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;

            // Efek loading boongan sebentar biar keren
            setTimeout(() => {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('submitBtn').disabled = false;

                // Cari data di dalam kode
                const pesananDitemukan = dataPesanan.find(pesanan => pesanan.id_order.toUpperCase() === orderId);

                if(pesananDitemukan) {
                    const tglExpired = new Date(pesananDitemukan.tgl_expired);
                    const tglOrder = new Date(pesananDitemukan.tgl_order);
                    const today = new Date();
                    
                    today.setHours(0, 0, 0, 0);
                    tglExpired.setHours(0, 0, 0, 0);
                    
                    const timeDiff = tglExpired.getTime() - today.getTime();
                    const remainingDays = Math.ceil(timeDiff / (1000 * 3600 * 24));
                    const isActive = remainingDays >= 0;

                    // Format tanggal biar cantik (Misal: 10 Okt 2026)
                    const formatCantik = (dateObj) => new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(dateObj);

                    document.getElementById('resProduct').textContent = pesananDitemukan.produk;
                    document.getElementById('resOrderDate').textContent = formatCantik(tglOrder);
                    document.getElementById('resExpireDate').textContent = formatCantik(tglExpired);
                    
                    const badge = document.getElementById('resStatusBadge');
                    const wBox = document.getElementById('warrantyBox');
                    const wText = document.getElementById('resWarranty');
                    const cta = document.getElementById('ctaBtn');

                    if(isActive) {
                        playSound('pop');
                        document.getElementById('resDuration').innerHTML = `${remainingDays}<span class="text-sm font-semibold text-gray-600 ml-1">Hari</span>`;
                        badge.className = 'px-3 py-1 text-[11px] font-extrabold rounded-md flex items-center gap-1.5 uppercase tracking-wider bg-brandLime text-darkText';
                        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-darkText animate-pulse"></span> AKTIF`;
                        
                        wBox.className = 'bg-green-50 p-3.5 rounded-2xl border border-green-100';
                        wText.className = 'font-extrabold text-sm text-green-700 mt-1 flex items-center gap-1';
                        wText.innerHTML = `Tersedia`;
                        
                        cta.className = 'w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md transform hover:-translate-y-1 bg-white border-2 border-brandPurple text-brandPurple hover:bg-brandPurpleLight';
                        document.getElementById('ctaText').textContent = 'Klaim Garansi / Bantuan';
                        cta.href = `https://wa.me/${nomorWA}?text=Halo min, saya mau klaim garansi untuk pesanan ID: ${pesananDitemukan.id_order} (${pesananDitemukan.produk})`;
                    } else {
                        playSound('error');
                        document.getElementById('resDuration').innerHTML = `0<span class="text-sm font-semibold text-gray-600 ml-1">Hari</span>`;
                        badge.className = 'px-3 py-1 text-[11px] font-extrabold rounded-md flex items-center gap-1.5 uppercase tracking-wider bg-red-100 text-red-700';
                        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> EXPIRED`;
                        
                        wBox.className = 'bg-gray-50 p-3.5 rounded-2xl border border-gray-200';
                        wText.className = 'font-extrabold text-sm text-gray-400 mt-1 flex items-center gap-1';
                        wText.innerHTML = `Hangus`;
                        
                        cta.className = 'w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md transform hover:-translate-y-1 bg-waGreen text-white hover:bg-green-600';
                        document.getElementById('ctaText').textContent = 'Perpanjang Langganan';
                        cta.href =
