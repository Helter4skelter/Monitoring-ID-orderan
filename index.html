<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Order & Garansi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brandPurple: '#5338FF',
                        brandPurpleLight: '#EEECFF',
                        brandLime: '#CCFF00',
                        darkText: '#0F172A',
                        softBg: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Efek Latar Belakang -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brandPurple/20 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-brandLime/30 rounded-full blur-[100px]"></div>
    </div>

    <!-- Kotak Utama -->
    <div class="glass-card rounded-[2rem] w-full max-w-md p-8 sm:p-10 z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brandPurpleLight text-brandPurple mb-5 rotate-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-darkText mb-2">Cek Orderan Kamu</h1>
            <p class="text-gray-500 font-medium text-sm">Masukkan ID Order untuk cek garansi</p>
        </div>

        <!-- Form Input -->
        <form id="orderForm" class="space-y-4">
            <input type="text" id="orderId" required
                class="w-full px-6 py-4 bg-white border-2 border-gray-100 focus:border-brandPurple focus:ring-4 focus:ring-brandPurple/10 rounded-2xl outline-none transition-all duration-300 font-bold tracking-widest text-center uppercase text-lg text-darkText placeholder-gray-300 shadow-sm"
                placeholder="CONTOH: ORD-123" autocomplete="off">

            <button type="submit" 
                class="w-full bg-darkText text-brandLime hover:bg-brandPurple hover:text-white font-bold text-lg py-4 rounded-2xl shadow-lg transform hover:-translate-y-1 transition-all duration-300 flex justify-center items-center gap-2">
                <span>Lacak Sekarang</span>
            </button>
        </form>

        <!-- Hasil / Result -->
        <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-100">
            
            <!-- Loading Spinner -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-4 hidden">
                <div class="w-8 h-8 border-4 border-brandPurpleLight border-t-brandPurple rounded-full animate-spin mb-3"></div>
                <p class="text-sm font-bold text-brandPurple animate-pulse">Memeriksa data...</p>
            </div>

            <!-- Data Box -->
            <div id="resultData" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-softBg p-4 rounded-xl border border-gray-100">
                    <span class="text-xs font-bold text-gray-500 uppercase">Status</span>
                    <span id="resStatus" class="px-3 py-1 bg-brandLime text-darkText text-xs font-extrabold rounded-full uppercase">AKTIF</span>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-brandPurpleLight p-4 rounded-xl text-center">
                        <p class="text-[11px] font-bold text-brandPurple uppercase mb-1">Sisa Durasi</p>
                        <p id="resDuration" class="text-2xl font-extrabold text-darkText">30 Hari</p>
                    </div>
                    <div class="bg-white border border-gray-100 p-4 rounded-xl text-center shadow-sm">
                        <p class="text-[11px] font-bold text-gray-400 uppercase mb-1">Garansi</p>
                        <p id="resWarranty" class="text-lg font-bold text-darkText">Tersedia</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'pop') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            } else {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            }
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        const form = document.getElementById('orderForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const orderId = document.getElementById('orderId').value.trim().toUpperCase();
            if(!orderId) return;

            playSound('pop');

            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('resultData').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');

            // Simulasi Loading 1 Detik
            setTimeout(() => {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultData').classList.remove('hidden');

                if(orderId.includes('EXP')) {
                    playSound('error');
                    document.getElementById('resStatus').textContent = 'EXPIRED';
                    document.getElementById('resStatus').className = 'px-3 py-1 bg-red-100 text-red-700 text-xs font-extrabold rounded-full uppercase';
                    document.getElementById('resDuration').textContent = '0 Hari';
                    document.getElementById('resDuration').classList.add('text-red-600');
                    document.getElementById('resWarranty').textContent = 'Hangus';
                } else {
                    playSound('pop');
                    document.getElementById('resStatus').textContent = 'AKTIF';
                    document.getElementById('resStatus').className = 'px-3 py-1 bg-brandLime text-darkText text-xs font-extrabold rounded-full uppercase';
                    document.getElementById('resDuration').textContent = '30 Hari';
                    document.getElementById('resDuration').classList.remove('text-red-600');
                    document.getElementById('resWarranty').textContent = 'Tersedia';
                }
            }, 1000);
        });
    </script>
</body>
</html>
