<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Order & Garansi</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brandPurple: '#5338FF',
                        brandPurpleLight: '#EEECFF',
                        brandLime: '#CCFF00',
                        darkText: '#0F172A',
                        softBg: '#F8FAFC',
                        waGreen: '#25D366'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body class="bg-softBg text-darkText font-sans min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">
    
    <!-- Main Card Container -->
    <main class="bg-white rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] w-full max-w-md overflow-hidden border border-gray-100 relative">
        
        <!-- Header Section -->
        <div class="bg-brandPurple p-8 text-center relative overflow-hidden">
            <!-- Dekorasi Simpel di Header -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-bl-full"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-white opacity-10 rounded-tr-full"></div>
            
            <div class="relative z-10 w-16 h-16 bg-brandLime rounded-2xl mx-auto flex items-center justify-center text-brandPurple shadow-lg mb-4 transform -rotate-3 hover:rotate-0 transition-transform">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="relative z-10 text-2xl font-extrabold text-white mb-1">Lacak Pesanan</h1>
            <p class="relative z-10 text-brandPurpleLight text-sm font-medium">Cek masa aktif dan status garansi layananmu</p>
        </div>

        <div class="p-6 sm:p-8">
            <form id="checkForm" class="space-y-4">
                <div class="relative">
                    <input type="text" id="orderId" 
                        class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-xl focus:bg-white focus:outline-none focus:border-brandPurple focus:ring-4 focus:ring-brandPurpleLight transition-all font-bold text-center uppercase tracking-wider text-lg placeholder-gray-300" 
                        placeholder="MASUKKAN ID ORDER" autocomplete="off" required>
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-darkText hover:bg-brandPurple text-white hover:text-brandLime font-bold py-4 px-4 rounded-xl transition-all duration-300 shadow-md flex items-center justify-center gap-2 group">
                    <span>Periksa Status</span>
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>

            <div id="loadingState" class="hidden py-8 flex flex-col items-center justify-center">
                <div class="w-10 h-10 border-4 border-brandPurpleLight border-t-brandPurple rounded-full animate-spin mb-3"></div>
                <p class="text-sm text-gray-500 font-bold animate-pulse">Menarik data dari database...</p>
            </div>

            <div id="resultState" class="hidden mt-6 animate-fade-in space-y-4">
                
                <!-- Status & Produk -->
                <div class="flex flex-col border border-gray-100 rounded-2xl bg-white shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">PRODUK</p>
                            <p id="resProduct" class="font-bold text-sm text-darkText">-</p>
                        </div>
                        <div id="resStatusBadge" class="px-3 py-1 text-[11px] font-extrabold rounded-md flex items-center gap-1.5 uppercase tracking-wider">
                            <!-- Status badge will be injected here -->
                        </div>
                    </div>

                    <!-- Detail Info Grid -->
                    <div class="grid grid-cols-2 divide-x divide-gray-100 p-4">
                        <div class="pr-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">TGL ORDER</p>
                            <p id="resOrderDate" class="text-xs font-semibold text-darkText">-</p>
                        </div>
                        <div class="pl-4">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">TGL EXPIRED</p>
                            <p id="resExpireDate" class="text-xs font-semibold text-darkText">-</p>
                        </div>
                    </div>
                </div>

                <!-- Durasi & Garansi Highlight -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-brandPurpleLight p-3.5 rounded-2xl border border-brandPurple/10">
                        <p class="text-[10px] font-bold text-brandPurple uppercase tracking-wider mb-1">Sisa Durasi</p>
                        <p id="resDuration" class="font-extrabold text-xl text-darkText">-</p>
                    </div>
                    <div id="warrantyBox" class="bg-green-50 p-3.5 rounded-2xl border border-green-100">
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Garansi</p>
                        <p id="resWarranty" class="font-extrabold text-sm text-darkText mt-1 flex items-center gap-1">
                            <!-- Warranty text here -->
                        </p>
                    </div>
                </div>

                <a href="#" id="ctaBtn" target="_blank" class="w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md transform hover:-translate-y-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    <span id="ctaText">Klaim Garansi / Bantuan</span>
                </a>

            </div>
        </div>
    </main>

    <script>
        // Web Audio API Configuration
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'pop') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            }
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // Helper to format date cleanly (e.g., 10 Okt 2026)
        function formatDateStr(dateStr) {
            const date = new Date(dateStr);
            if(isNaN(date.getTime())) return dateStr; // Jaga-jaga kalau format error
            return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
        }

        const form = document.getElementById('checkForm');
        const input = document.getElementById('orderId');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loadingState');
        const result = document.getElementById('resultState');

        // =======================================================
        // SETUP KONEKSI LANGSUNG KE GOOGLE SHEETS
        // =======================================================
        const sheetId = '1cl4CF0KJWAvqFsm98UkFeMkgGQWqQzs47MpCzWR7Zm8'; 
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
        const phoneNumber = '6281299961001'; // Nomor WA Admin

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const orderId = input.value.trim().toUpperCase();
            if(!orderId) return;

            // Play submit sound
            playSound('pop');

            // UI Reset
            result.classList.add('hidden');
            loading.classList.remove('hidden');
            input.disabled = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');

            // Menarik data langsung dari Google Sheets via CSV Export
            fetch(sheetUrl)
                .then(res => {
                    if(!res.ok) throw new Error("Gagal terhubung ke Sheets");
                    return res.text();
                })
                .then(csvText => {
                    const rows = csvText.split('\n');
                    let foundData = null;
                    
                    // Kita cari ID-nya. Mulai dari i=1 karena index 0 itu header (judul kolom)
                    for(let i = 1; i < rows.length; i++) {
                        // Memisahkan kolom dengan aman meski ada tanda kutip
                        const cols = rows[i].split(',').map(c => c.replace(/(^"|"$)/g, '').trim());
                        
                        if(cols[0] && cols[0].toUpperCase() === orderId) {
                            foundData = {
                                id: cols[0],
                                produk: cols[1],
                                tgl_order: cols[2],
                                tgl_expired: cols[3]
                            };
                            break;
                        }
                    }

                    // Selesai loading
                    loading.classList.add('hidden');
                    input.disabled = false;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50');

                    if(foundData) {
                        // Hitung tanggal
                        const tglExpired = new Date(foundData.tgl_expired);
                        const today = new Date();
                        today.setHours(0,0,0,0);
                        
                        let remainingDays = 0;
                        let isActive = false;
                        
                        if(!isNaN(tglExpired.getTime())) {
                            tglExpired.setHours(0,0,0,0);
                            const timeDiff = tglExpired.getTime() - today.getTime();
                            remainingDays = Math.ceil(timeDiff / (1000 * 3600 * 24));
                            isActive = remainingDays >= 0;
                        }

                        // Update tampilan
                        document.getElementById('resProduct').textContent = foundData.produk;
                        document.getElementById('resOrderDate').textContent = formatDateStr(foundData.tgl_order);
                        document.getElementById('resExpireDate').textContent = formatDateStr(foundData.tgl_expired);
                        document.getElementById('resDuration').innerHTML = `${remainingDays}<span class="text-sm font-semibold text-gray-500 ml-1">Hari</span>`;

                        const badge = document.getElementById('resStatusBadge');
                        const warrantyBox = document.getElementById('warrantyBox');
                        const warrantyText = document.getElementById('resWarranty');
                        const ctaBtn = document.getElementById('ctaBtn');
                        const ctaText = document.getElementById('ctaText');

                        // Misal garansi hangus jika sisa kurang dari 5 hari
                        const isWarrantyActive = isActive && (remainingDays > 5);

                        if (isActive) {
                            playSound('pop'); 
                            
                            badge.className = 'px-3 py-1 text-[11px] font-extrabold rounded-md flex items-center gap-1.5 uppercase tracking-wider bg-brandLime text-darkText';
                            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-darkText animate-pulse"></span> AKTIF`;

                            if(isWarrantyActive) {
                                warrantyBox.className = 'bg-green-50 p-3.5 rounded-2xl border border-green-100';
                                warrantyText.className = 'font-extrabold text-sm text-green-700 mt-1 flex items-center gap-1';
                                warrantyText.innerHTML = `<svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Tersedia`;
                            } else {
                                warrantyBox.className = 'bg-orange-50 p-3.5 rounded-2xl border border-orange-100';
                                warrantyText.className = 'font-extrabold text-sm text-orange-700 mt-1 flex items-center gap-1';
                                warrantyText.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Hampir Habis`;
                            }

                            ctaBtn.className = 'w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md transform hover:-translate-y-1 bg-white border-2 border-brandPurple text-brandPurple hover:bg-brandPurpleLight';
                            ctaText.textContent = 'Klaim Garansi / Bantuan';
                            const msg = encodeURIComponent(`Halo min, saya ingin klaim garansi atau minta bantuan untuk pesanan ${foundData.id} (${foundData.produk}).`);
                            ctaBtn.href = `https://wa.me/${phoneNumber}?text=${msg}`;

                        } else {
                            playSound('error'); 
                            
                            badge.className = 'px-3 py-1 text-[11px] font-extrabold rounded-md flex items-center gap-1.5 uppercase tracking-wider bg-red-100 text-red-700';
                            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> EXPIRED`;

                            warrantyBox.className = 'bg-gray-50 p-3.5 rounded-2xl border border-gray-200';
                            warrantyText.className = 'font-extrabold text-sm text-gray-400 mt-1 flex items-center gap-1';
                            warrantyText.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Hangus`;

                            ctaBtn.className = 'w-full mt-2 py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-md transform hover:-translate-y-1 bg-waGreen text-white hover:bg-green-600 hover:shadow-lg hover:shadow-green-500/30';
                            ctaText.textContent = 'Perpanjang Langganan';
                            const msg = encodeURIComponent(`Halo min, langganan saya untuk pesanan ${foundData.id} (${foundData.produk}) sudah habis. Saya mau perpanjang.`);
                            ctaBtn.href = `https://wa.me/${phoneNumber}?text=${msg}`;
                        }

                        // Tampilkan hasil
                        result.classList.remove('hidden');
                    } else {
                        playSound('error');
                        alert('Order ID tidak ditemukan! Cek kembali ID pesanannya ya Kak.');
                    }
                })
                .catch(err => {
                    loading.classList.add('hidden');
                    input.disabled = false;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50');
                    playSound('error');
                    alert('Gagal mengambil data. Pastikan koneksi internet lancar dan pengaturan Share di Google Sheets sudah "Siapa Saja".');
                });
        });
    </script>
</body>
</html>
